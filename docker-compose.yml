services:
  backend:
    build: ./backend
    container_name: flower-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # These can be overridden by .env file or docker-compose command line
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-5.2-chat}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_DALLE_DEPLOYMENT_NAME=${AZURE_DALLE_DEPLOYMENT_NAME:-dall-e-3}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: flower-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
