server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver for dynamic proxy_pass (Azure DNS + Google fallback)
    resolver 168.63.129.16 8.8.8.8 valid=30s ipv6=off;

    # Proxy API requests to the backend container
    location /api/ {
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        proxy_set_header Host flower-backend.ashysand-5f2697d3.swedencentral.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Serve static files, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
